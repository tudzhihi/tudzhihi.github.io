<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB Auto Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #ffffff; width: 100%; max-width: 400px; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { color: #1877f2; margin-bottom: 20px; font-size: 20px; text-align: center; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #65676b; margin-bottom: 6px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccd0d5; border-radius: 6px; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #1877f2; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        button:hover { background: #166fe5; }
        .log-box { margin-top: 15px; background: #1e1e1e; color: #00ff66; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 11px; height: 120px; overflow-y: auto; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div class="card">
        <h2>⚡ FB Profile Manager</h2>
        <div class="form-group">
            <label>First Name</label>
            <input type="text" id="fname" value="Nguyen Tu">
        </div>
        <div class="form-group">
            <label>Last Name (Ký tự ẩn / Trống)</label>
            <input type="text" id="lname" value=" .kk">
        </div>
        <div class="form-group">
            <label>Contact Email</label>
            <input type="text" id="email" value="tunguyenanhkai@ybo.com">
        </div>
        <button id="run-btn">Gửi Yêu Cầu Đổi Tên Ngầm</button>

        <div id="log" class="log-box">Sẵn sàng nhận lệnh từ Web...</div>
    </div>

    <script>
        const logBox = document.getElementById('log');
        function addLog(msg) {
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `[${time}] ${msg}\n`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        document.getElementById('run-btn').onclick = () => {
            const data = {
                action: 'RUN_FB_AUTO',
                fname: document.getElementById('fname').value,
                lname: document.getElementById('lname').value,
                email: document.getElementById('email').value
            };

            addLog("Đang phát tín hiệu thực thi đến extension/script trên máy...");
            window.postMessage(data, "*");
        };

        window.addEventListener("message", (event) => {
            if (event.data && event.data.action === 'FB_AUTO_LOG') {
                addLog(event.data.message);
            }
        });
    </script>
</body>
</html>
